[project]
name = "keboola.vcr"
version = "0.0.0"
description = "VCR recording, sanitization, and validation for Keboola component HTTP interactions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vcrpy>=8.3.0,<9",  # floor 8.3.0: 8.2.1 safe-YAML security fix (GHSA-rpj2-4hq8-938g); cassette._save/append are private API we depend on
    "freezegun>=1.5.5,<2",
    "typing-extensions>=4; python_version < '3.11'",  # typing.Self backport for db_recorder __enter__ annotations
]

[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "keboola.vcr"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.16.1"
]

[project.urls]
Homepage = "https://github.com/keboola/python-vcr-tests"
Repository = "https://github.com/keboola/python-vcr-tests"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.format]
# ruff 0.16 formats Python inside Markdown/README by default; this repo has never
# done that. Keep the formatter scoped to source so it doesn't churn docs.
exclude = ["*.md"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
